name: E2E Tests

on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  job_e2e_tests:
    name: Run E2E tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare Frontend
        run: npm run dev -- --host 127.0.0.1 > frontend.log 2>&1 &

      - name: Wait until Ready
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4321 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat frontend.log
          exit 1

      - name: Run E2e-Tests
        run: xvfb-run --auto-servernum npm run e2e:test


