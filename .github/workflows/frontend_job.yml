name: Build frontend

on:
  workflow_call:
  workflow_dispatch:
  push:

jobs:
  job_build_frontend:
    name: Build frontend code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      - name: Run ESLint check
        run: npx eslint .
      - name: Run tests
        run: npm run test-coverage
      - name: Build Frontend
        run: npm run build